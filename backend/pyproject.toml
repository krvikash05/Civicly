[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civicly-backend"
version = "0.1.0"
description = "Civicly backend foundation; agent and domain phases pending"
requires-python = ">=3.12,<3.13"
dependencies = [
    "falkordb==1.8.0",
    "redis==8.1.0",
    "fastapi==0.143.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "mcp==2.3.0",
    "jsonschema==4.26.0",
    "httpx==0.28.1",
    "sentencepiece==0.2.1",
    "langgraph==1.2.16",
    "langchain-falkordb[langgraph]==0.2.0",
    "graphrag-sdk[markdown,pdf]==1.4.0",
]

[project.scripts]
civicly = "cli.main:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "uv==0.13.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "cli*"]

[tool.setuptools.package-data]
"app.graph" = ["migrations/*.json"]
"app.agents" = ["prompts/*.txt", "pricing/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: requires actual local FalkorDB and Browser; unavailable services FAIL",
    "persistence: opt-in restart/recreation of the civicly Compose service",
]

[tool.uv]
required-version = "==0.13.1"
