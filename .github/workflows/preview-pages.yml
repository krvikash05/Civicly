name: Publish interactive Civicly overview

on:
  push:
    branches: [main]
    paths:
      - docs/media/civicly-preview/**
      - .github/workflows/preview-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civicly-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare preview-only website
        run: |
          mkdir -p _site
          cp docs/media/civicly-preview/preview.html _site/index.html
          cp docs/media/civicly-preview/scene-*.png _site/
          cp docs/media/civicly-preview/civicly-explainer.gif _site/
          cp docs/media/civicly-preview/storyboard.png _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
